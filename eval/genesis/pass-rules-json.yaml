# Audit spec for the pass-rule grammar, with a strict run-record verifier (U0g, item 8c).
#
# Run from the repository root:
#   genesis audit-evaluator eval/genesis/pass-rules-json.yaml --suite json      # must exit 0
#
# The verifier is `eval/genesis/json_verifier.py`. genesis's `json` suite hands a verifier a task and
# a completion and expects a verdict. Here, for the dataset rows (`cases.jsonl`), the task is one
# pass rule from `eval/core-tasks.md` plus the run context it is judged against, and the completion
# is a run record as `summary.json` stores it. The verifier parses the completion strictly
# (duplicate keys, prose around the JSON, fields outside the run-record schema and wrong types are
# all rejections), checks that the record agrees with the run context, and gives the verdict to
# `pass_rules.evaluate`. A record's own `pass` and `failed_rules` are never trusted.
#
# What this audit does and does not cover. genesis only changes the completion, and the evidence a
# rule is judged on lives in the task, so every rejection genesis can provoke comes from the strict
# parser or from the record-versus-evidence checks. It never makes a rule evaluate false. It shows
# that a run record cannot be forged, padded, echoed, swapped for another run's, or smuggled past
# the parser. Whether each rule kind accepts good evidence and refuses bad evidence is tested by
# `eval/genesis/test_json_verifier.py`, which runs the known-good record and every known-bad case
# in `cases.jsonl` (at least one per rule kind) through the same verifier. Both parts are needed.
#
# Two things are added to the design's item 8c, and are recorded for the owner:
#   1. genesis's own `json` suite probes are tool-call payloads with a schema and a reference, not
#      run records, so the verifier also accepts that shape (strict parse, schema, exact match).
#   2. the dataset's wrong-gold probe hands a record from another run, so the verifier checks the
#      record's reply, token count and ask count against the run context.
#
# `cases.jsonl` is generated by `eval/genesis/build_cases.py`; regenerate it after changing
# `eval/core-tasks.md` or `eval/fixtures/`.
name: heron-pass-rules-json
dataset:
  path: eval/genesis/cases.jsonl
subject:
  command: "cat {task_file}"
evaluator:
  type: command
  command: "python3 -I eval/genesis/json_verifier.py {task_file} {completion_file} {output_file}"
metrics:
  - task_success
thresholds:
  task_success: ">=0.90"
