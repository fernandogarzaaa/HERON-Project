# Audit spec for the replay grader, with a strict replay-record verifier (item 20).
#
# Run from the repository root:
#   genesis audit-evaluator eval/selfheal/genesis.yaml --suite json      # must exit 0
#
# The verifier is `eval/selfheal/replay_verifier.py`, built the way `eval/genesis/json_verifier.py` is
# for the pass-rule grammar (see `eval/genesis/pass-rules-json.yaml`). Here, for the dataset rows
# (`genesis_cases.jsonl`), the task is one replay case, its fix commit and what was measured for it
# (the five fields `run_replay.py` hands to `grade`), and the completion is the record the replay
# stores. The verifier parses the completion strictly, checks the record is about this case and
# carries this outcome, and gives the verdict to `grade.grade`. A record's own `pass` is never trusted.
#
# What this audit does and does not cover. genesis only changes the completion, and the outcome lives
# in the task, so every rejection genesis can provoke comes from the strict parser or from the
# record-versus-task checks. It shows a record cannot be forged, padded, echoed, swapped for another
# case's or smuggled past the parser. That an empty patch, a deleted hidden test and each other wrong
# outcome grades false is tested by `eval/tests/test_selfheal_replay.py`, which replays the known-bad
# records in `genesis_cases.jsonl` through the same verifier. Both parts are needed.
#
# `genesis_cases.jsonl` is generated by `eval/selfheal/build_genesis_cases.py`; regenerate it after
# changing `eval/selfheal/cases.md`.
name: heron-selfheal-grade
dataset:
  path: eval/selfheal/genesis_cases.jsonl
subject:
  command: "cat {task_file}"
evaluator:
  type: command
  command: "python3 -I eval/selfheal/replay_verifier.py {task_file} {completion_file} {output_file}"
metrics:
  - task_success
thresholds:
  task_success: ">=0.90"
