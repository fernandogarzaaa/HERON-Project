name: Release
# Pushing a tag like v0.1.0 builds the installers on real macOS, Windows and Linux machines
# and publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo test
      - run: ./packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Heron-macos-universal.dmg
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo test
      - name: Inno Setup (for the installer; the zip is built either way)
        continue-on-error: true
        run: choco install innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Heron-windows-x64.zip
            dist/Heron-Setup-windows-x64.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo test
      - run: ./packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Heron-linux-x64.tar.gz
          if-no-files-found: error
  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Its own folder: the repository already has an `assets` folder, and anything in the upload
          # folder is published.
          path: release-files
          merge-multiple: true
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - name: Checksums
        run: cd release-files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          awk -v tag="${GITHUB_REF_NAME#v}" '$0 ~ "^## " {on = ($0 ~ tag)} on' CHANGELOG.md > "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* --title "Heron $GITHUB_REF_NAME (beta)" --notes-file "$notes" --prerelease
          fi
