name: Release
# Tags continue to build normally. The one-time controlled v0.3.0 trigger
# exists so GitHub Actions can mint the tag from an audited main SHA even when
# the release operator's connector cannot create Git tags directly.
on:
  push:
    tags: ["v*"]
    branches: ["release/v0.3.0-publish"]
permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve a pinned, authorized release revision
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            target="$GITHUB_SHA"
          elif [[ "$GITHUB_REF" == "refs/heads/release/v0.3.0-publish" ]]; then
            tag="v0.3.0"
            target="${{ github.event.before }}"
            [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected an existing commit as release target"; exit 1; }
            main_head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
            [[ "$target" == "$main_head" ]] || { echo "Main moved since this release branch was cut; refusing to tag a stale commit"; exit 1; }
          else
            echo "Unknown release trigger: $GITHUB_REF"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target }}
      - name: Validate package, lockfile and changelog versions
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [[ "v$version" == "$RELEASE_TAG" ]] || { echo "Tag and package version differ"; exit 1; }
          grep -Fq "## $version " CHANGELOG.md || { echo "No changelog entry for $version"; exit 1; }
          awk '/^name = "heron"$/{found=1; next} found && /^version = /{print; exit}' Cargo.lock | grep -Fxq "version = \"$version\"" || { echo "Cargo.lock package version differs"; exit 1; }
      - name: Refuse an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Never overwrite published assets."
            exit 1
          fi

  macos:
    needs: source
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.target }}
      - run: rustup update stable && rustup default stable
      - run: cargo test --locked
        env:
          HERON_REQUIRE_SEATBELT: "1"
      - name: Choose signed or unsigned build
        id: mode
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERT_P12" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MACOS_CERT_P12 is empty, so this macOS build is unsigned and not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import the Developer ID certificate
        if: steps.mode.outputs.signed == 'true'
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/heron-signing.keychain-db
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          keychain_password=$(uuidgen)
          cert="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$cert" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH"
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing
          rm -f "$cert"
          # The App Store Connect key that notarytool reads through ASC_KEY_PATH.
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
      - name: Build the app, signed and notarized
        if: steps.mode.outputs.signed == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash packaging/macos/build-app.sh --sign
      - name: Build the app, unsigned
        if: steps.mode.outputs.signed != 'true'
        run: bash packaging/macos/build-app.sh --unsigned
      - name: Delete the signing keychain and the App Store Connect key
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/heron-signing.keychain-db
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP/developer-id.p12"
      - name: Verify the macOS app signature
        run: codesign --verify --deep --strict dist/Heron.app
      - name: Verify the notarization tickets
        if: steps.mode.outputs.signed == 'true'
        run: |
          xcrun stapler validate dist/Heron.app
          xcrun stapler validate dist/Heron-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Heron-macos-universal.dmg
          if-no-files-found: error

  windows:
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.target }}
      - run: rustup update stable && rustup default stable
      - run: cargo test --locked
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - name: Verify both Windows distributions exist
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Heron-windows-x64.zip")) { throw "Windows ZIP missing" }
          if (!(Test-Path "dist/Heron-Setup-windows-x64.exe")) { throw "Windows installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Heron-windows-x64.zip
            dist/Heron-Setup-windows-x64.exe
          if-no-files-found: error

  linux:
    needs: source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.target }}
      - run: rustup update stable && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libssl-dev pkg-config
      - run: cargo test --locked
      - name: Linux installer smoke test
        run: bash tests/linux-install-smoke.sh
      - run: ./packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Heron-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    needs: [source, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.target }}
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Require all four distribution files
        shell: bash
        run: |
          set -euo pipefail
          for file in Heron-macos-universal.dmg Heron-windows-x64.zip Heron-Setup-windows-x64.exe Heron-linux-x64.tar.gz; do
            test -s "release-files/$file" || { echo "Missing release artifact: $file"; exit 1; }
          done
      - name: Generate SHA256 checksums
        run: cd release-files && sha256sum Heron-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish immutable beta release at pinned revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_TARGET: ${{ needs.source.outputs.target }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG"
            exit 1
          fi
          notes=$(mktemp)
          awk -v header="## ${RELEASE_TAG#v} " '/^## / { showing = (index($0, header) == 1) } showing { print }' CHANGELOG.md > "$notes"
          test -s "$notes" || { echo "Missing release notes"; exit 1; }
          if [[ "$MACOS_SIGNED" != "true" ]]; then
            printf '\n**Note:** the macOS app in this release is unsigned and not notarized. Open it with right-click, then Open.\n' >> "$notes"
          fi
          gh release create "$RELEASE_TAG" release-files/* --target "$RELEASE_TARGET" --title "Heron $RELEASE_TAG (Research preview)" --notes-file "$notes" --prerelease
