name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Linux libraries for the desktop window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Tests
        run: cargo test
        env:
          # Also drive the machine's real browser (Chrome or Edge) against a local test site.
          HERON_TEST_BROWSER: "1"
      - name: Build the desktop app
        run: cargo build --features desktop --bins
      - name: Desktop bridge and SSE tests
        run: cargo test --features desktop --bin heron-desktop
  neural:
    # The optional neural memory model. Informational for now: it tells us on which systems the
    # ONNX runtime builds and the model loads, without holding up everything else.
    name: Neural memory (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest] # the bundled ONNX runtime needs glibc 2.38+ on Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Memory evaluation with the neural model
        run: cargo test --features neural --lib -- --ignored neural --nocapture
