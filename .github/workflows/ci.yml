name: CI
on:
  push:
    # feat/heron-v1 is the v1 integration branch: CI on all three OSes must be green on it before the v1 PR.
    branches: [main, feat/heron-v1]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the Slint window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libssl-dev pkg-config
      - name: Tests
        run: cargo test --locked
        env:
          # Also drive the machine's real browser (Chrome or Edge) against a local test site.
          HERON_TEST_BROWSER: "1"
      - name: Qualify native connector credential vault
        if: runner.os == 'macOS' || runner.os == 'Windows'
        # Exercise the real OS backend with disposable, profile-isolated keys.
        # Keep this required: a locked/unavailable backend is not a passing gate.
        run: cargo test --locked --lib -- --ignored --exact config::tests::connector_vault_live_round_trip oauth::tests::reconnecting_the_same_account_keeps_its_data_vault_live
      - name: Build the desktop app
        run: cargo build --locked --features desktop --bins
      - name: Desktop bridge and SSE tests
        run: cargo test --locked --features desktop --bin heron-desktop
      - name: Capture Slint headless UI snapshots
        if: runner.os == 'Linux'
        run: cargo test --locked --features desktop --bin heron-desktop window_layout_tests::main_window_lays_out_and_renders_without_a_binding_loop -- --exact --nocapture
        env:
          HERON_UI_SNAPSHOTS_DIR: target/ui-snapshots
      - name: Upload UI snapshot evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: slint-ui-snapshots-${{ github.sha }}
          path: target/ui-snapshots/*.bmp
          if-no-files-found: error
          retention-days: 14
      - name: Linux installer smoke test
        if: runner.os == 'Linux'
        run: bash tests/linux-install-smoke.sh
  neural:
    # The optional neural memory model. Informational for now: it tells us on which systems the
    # ONNX runtime builds and the model loads, without holding up everything else.
    name: Neural memory (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest] # the bundled ONNX runtime needs glibc 2.38+ on Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Memory evaluation with the neural model
        run: cargo test --locked --features neural --lib -- --ignored neural --nocapture
  macos-app:
    # The native macOS app: Rust lints, Swift tests, the unsigned bundle and the upgrade test.
    name: macOS app
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so make-upgrade-fixture.sh --binary-only can reach commit 9253959.
          fetch-depth: 0
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: "Diag: crashing test alone (x3)"
        continue-on-error: true
        env: { SWIFT_BACKTRACE: "enable=yes,interactive=no" }
        run: for i in 1 2 3; do swift test --package-path macos/HeronMac --filter 'ConnectionsSnapshotTests/testConnectionsTabWithAGoogleAccountConnectedLight' || echo "ALONE RUN $i FAILED"; done
      - name: "Diag: ConnectionsSnapshotTests class alone"
        continue-on-error: true
        env: { SWIFT_BACKTRACE: "enable=yes,interactive=no" }
        run: swift test --package-path macos/HeronMac --filter 'ConnectionsSnapshotTests' || echo "CLASS RUN FAILED"
      - name: Swift tests
        env: { SWIFT_BACKTRACE: "enable=yes,interactive=no" }
        run: swift test --package-path macos/HeronMac
      - name: "Diag: crash reports"
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/xctest* 2>/dev/null | head -2); do echo "=== $f"; head -c 60000 "$f"; done
      - name: Build the unsigned app
        run: bash packaging/macos/build-app.sh --unsigned
      - name: Upgrade test
        run: bash packaging/macos/upgrade-test.sh
