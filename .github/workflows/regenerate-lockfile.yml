name: One-time v0.3.0 Cargo.lock refresh
on:
  push:
    branches: ["release/v0.3.0-lock-refresh"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Rust stable
        run: rustup update stable && rustup default stable
      - name: Reconcile the full resolved dependency graph
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Commit the generated lockfile to this temporary branch
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "No lockfile update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(lockfile): synchronize native Slint dependency resolution"
          git push origin HEAD:refs/heads/release/v0.3.0-lock-refresh
