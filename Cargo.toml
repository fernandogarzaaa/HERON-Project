[package]
name = "heron"
version = "0.3.0"
edition = "2021"
description = "Heron — a local-first, private, proactive personal AI agent"
license = "Apache-2.0"
repository = "https://github.com/fernandogarzaaa/HERON-Project"

[lib]
name = "heron"
path = "src/lib.rs"

[[bin]]
name = "heron"
path = "src/main.rs"

[[bin]]
name = "heron-desktop"
path = "src/bin/desktop/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
globset = "0.4"
html2text = "0.14"
ignore = "0.4"
libc = "0.2"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", features = ["compat-1-18"], optional = true }
arboard = { version = "3", optional = true }
rfd = { version = "0.18", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
dunce = "1.0.5"
base64 = "0.22"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[features]
# Native desktop window, now built with Slint (was a WebView via wry/tao/muda, removed
# in the native rebuild). Every existing invocation keeps working: `cargo build --features
# desktop --bins` and the packaging scripts all build the Slint window through this flag.
desktop = ["dep:slint", "dep:slint-build", "dep:arboard", "dep:rfd"]
# Neural memory search: a small sentence-embedding model (all-MiniLM-L6-v2) run locally.
# Adds the ONNX runtime to the binary; the model itself (about 23 MB) is downloaded once, on first use,
# and only if the user switches it on.
neural = ["dep:fastembed"]

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
